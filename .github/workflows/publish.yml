name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: h5/package-lock.json

    - name: Build H5 static assets
      working-directory: h5
      run: npm ci && npm run build

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv twine
    
    - name: Build package
      run: uv build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.MCP_GS_ROBOT }}
      run: twine upload dist/*