<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">mcp-gs-robot V3 architecture</title>
  <desc id="desc">MCP, HTTP and H5, Pi Agent CLI, and Agent Skill share one tool registry backed by the V3 API client.</desc>
  <rect width="960" height="510" fill="#f8fafc"/>
  <text x="480" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#17324d">mcp-gs-robot · V3</text>
  <g fill="#e5efff" stroke="#3465a4" stroke-width="2">
    <rect x="25" y="90" width="212" height="100" rx="10"/>
    <rect x="257" y="90" width="212" height="100" rx="10"/>
    <rect x="489" y="90" width="212" height="100" rx="10"/>
    <rect x="721" y="90" width="212" height="100" rx="10"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#17324d">
    <text x="131" y="130" font-size="18">MCP server</text><text x="131" y="158" font-size="13">stdio · mcp-gs-robot</text>
    <text x="363" y="130" font-size="18">HTTP + H5</text><text x="363" y="158" font-size="13">REST / SSE · FastAPI</text>
    <text x="595" y="130" font-size="18">Pi Agent CLI</text><text x="595" y="158" font-size="13">Anthropic / OpenAI-compatible</text>
    <text x="827" y="130" font-size="18">Agent Skill</text><text x="827" y="158" font-size="13">Claude Code / Codex / WorkBuddy</text>
  </g>
  <g stroke="#3465a4" stroke-width="2" fill="none">
    <path d="M131 190 V225 H480 V247"/><path d="M363 190 V225"/><path d="M595 190 V225"/><path d="M827 190 V225 H480"/>
    <path d="M480 324 V351"/><path d="M480 423 V446"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#17324d">
    <rect x="185" y="248" width="590" height="76" rx="10" fill="#d9f4e6" stroke="#238463" stroke-width="2"/>
    <text x="480" y="279" font-size="20">Shared tool registry · 40 tools</text>
    <text x="480" y="304" font-size="14">snake_case inputs · tool schemas · dangerous flags</text>
    <rect x="185" y="352" width="590" height="72" rx="10" fill="#fff1d8" stroke="#ba7922" stroke-width="2"/>
    <text x="480" y="381" font-size="19">GausiumV3 client · HTTP client · token manager</text>
    <text x="480" y="404" font-size="14">36 V3 tool endpoints + legacy list + local/workflow tools</text>
    <text x="480" y="479" font-size="19">Gausium OpenAPI V3 / robots</text>
  </g>
</svg>
