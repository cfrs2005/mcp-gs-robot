<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="312" viewBox="0 0 1200 312" role="img"><title>run_cleaning_task workflow</title><defs><marker id="a5b6b7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="a0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2a44" flood-opacity=".08"/></filter></defs><rect width="1200" height="312" rx="20" fill="#f6f9fc"/><text x="600" y="50" font-size="22" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">run_cleaning_task · 把安全操作流程收进一个工具</text><rect x="212" y="78" width="970" height="148" rx="18" fill="#fffaf0" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="567" y="66" width="260" height="24" rx="12.0" fill="#fff6e6" stroke="#d97706" stroke-width="1"/><text x="697.0" y="82.32" font-size="12" fill="#d97706" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">⚠ 整个调用只确认一次</text><g filter="url(#sh)"><rect x="27" y="110" width="176" height="96" rx="14" fill="#ffffff" stroke="#5b6b7f" stroke-width="2" stroke-dasharray="6 4"/></g><text x="115" y="138" font-size="13" fill="#5b6b7f" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">0</text><text x="115" y="162" font-size="12" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">get_robot_status</text><text x="115" y="186" font-size="12" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">先检查（你 / Agent）</text><path d="M206 158 L218 158" stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#a5b6b7f)"/><g filter="url(#sh)"><rect x="221" y="110" width="176" height="96" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/></g><text x="309" y="138" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">1</text><text x="309" y="162" font-size="12" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">get_robot_capabilities</text><text x="309" y="186" font-size="12" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">是否支持组合任务</text><path d="M400 158 L412 158" stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#a5b6b7f)"/><g filter="url(#sh)"><rect x="415" y="110" width="176" height="96" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/></g><text x="503" y="138" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">2</text><text x="503" y="162" font-size="12" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">list_task_resources</text><text x="503" y="186" font-size="12" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">resource_ids 必须存在</text><path d="M594 158 L606 158" stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#a5b6b7f)"/><g filter="url(#sh)"><rect x="609" y="110" width="176" height="96" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/></g><text x="697" y="138" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">3</text><text x="697" y="162" font-size="12" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">create_task_definition</text><text x="697" y="186" font-size="12" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">→ fusionTaskId</text><path d="M788 158 L800 158" stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#a5b6b7f)"/><g filter="url(#sh)"><rect x="803" y="110" width="176" height="96" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/></g><text x="891" y="138" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">4</text><text x="891" y="162" font-size="12" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">start_task</text><text x="891" y="186" font-size="12" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">→ requestId</text><path d="M982 158 L994 158" stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#a5b6b7f)"/><g filter="url(#sh)"><rect x="997" y="110" width="176" height="96" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/></g><text x="1085" y="138" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">5</text><text x="1085" y="162" font-size="12" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">get_command_status</text><text x="1085" y="186" font-size="12" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">直到 cmdStatus=6 或失败</text><text x="600" y="262" font-size="12.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">第 1–5 步在一次调用内完成，每一步都单独记入调用日志。cmdStatus=6 表示已投递、不是已完成；超过 wait_seconds 返回 timeout。</text><text x="600" y="284" font-size="12.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">resource_ids 不存在时在创建任何东西之前就报错。Agent Skill 把同样的顺序教给逐个调工具的 Agent。</text></svg>