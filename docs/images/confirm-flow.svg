text x="600.0" y="548" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">wait_for_command</text><text x="600.0" y="576" font-size="11.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">poll until terminal</text><path d="M442 608 L158 608" stroke="#5b6b7f" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a5b6b7f)"/><rect x="172.0" y="583" width="256" height="20" rx="6" fill="#f6f9fc" stroke="none" stroke-width="0"/><text x="300.0" y="598" font-size="13" fill="#5b6b7f" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">“Task instance 47d0… started”</text><rect x="438" y="290" width="24" height="86" rx="6" fill="#d97706" opacity=".18"/><text x="600" y="702" font-size="13.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">Reject → the tool never reaches the robot and the model is told it was declined.</text></svg>
