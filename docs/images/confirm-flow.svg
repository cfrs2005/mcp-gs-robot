<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Dangerous tool confirmation flow</title><defs><marker id="a5b6b7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="a0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2a44" flood-opacity=".08"/></filter></defs><rect width="1200" height="760" rx="20" fill="#f6f9fc"/><text x="600" y="50" font-size="22" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">Every call that moves a robot or writes data passes a confirmation gate</text><g filter="url(#sh)"><rect x="55" y="70" width="190" height="46" rx="12" fill="#ffffff" stroke="#0f2a44" stroke-width="2"/></g><text x="150" y="99" font-size="16" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">You</text><path d="M150 118 V664" stroke="#c9d6e4" stroke-width="2" fill="none" stroke-dasharray="3 5"/><g filter="url(#sh)"><rect x="355" y="70" width="190" height="46" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/></g><text x="450" y="99" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">Saodi 扫地僧</text><path d="M450 118 V664" stroke="#c9d6e4" stroke-width="2" fill="none" stroke-dasharray="3 5"/><g filter="url(#sh)"><rect x="655" y="70" width="190" height="46" rx="12" fill="#ffffff" stroke="#0f2a44" stroke-width="2"/></g><text x="750" y="99" font-size="16" fill="#0f2a44" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">Tool Registry</text><path d="M750 118 V664" stroke="#c9d6e4" stroke-width="2" fill="none" stroke-dasharray="3 5"/><g filter="url(#sh)"><rect x="955" y="70" width="190" height="46" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/></g><text x="1050" y="99" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">Gausium V3</text><path d="M1050 118 V664" stroke="#c9d6e4" stroke-width="2" fill="none" stroke-dasharray="3 5"/><path d="M158 162 L442 162" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a2563eb)"/><rect x="167.6" y="137" width="265" height="20" rx="6" fill="#f6f9fc"/><text x="300.0" y="152" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">“Start the lobby dust-push task”</text><path d="M458 212 L742 212" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a2563eb)"/><rect x="525.6" y="187" width="149" height="20" rx="6" fill="#f6f9fc"/><text x="600.0" y="202" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">get_robot_status</text><text x="600.0" y="230" font-size="11.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">safe → runs immediately</text><path d="M758 262 L1042 262" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a2563eb)"/><rect x="821.7" y="237" width="157" height="20" rx="6" fill="#f6f9fc"/><text x="900.0" y="252" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">robots/status/get</text><path d="M442 312 L158 312" stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ad97706)"/><rect x="182.4" y="287" width="235" height="20" rx="6" fill="#f6f9fc"/><text x="300.0" y="302" font-size="13" fill="#d97706" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">confirm_required · start_task</text><text x="300.0" y="330" font-size="11.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">dangerous=True → stream pauses</text><path d="M158 362 L442 362" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a16a34a)"/><rect x="253.9" y="337" width="92" height="20" rx="6" fill="#f6f9fc"/><text x="300.0" y="352" font-size="13" fill="#16a34a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">approve ✓</text><text x="300.0" y="380" font-size="11.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">[y/N] · H5 button · POST …/confirm</text><path d="M458 412 L742 412" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#ad97706)"/><rect x="549.0" y="387" width="102" height="20" rx="6" fill="#f6f9fc"/><text x="600.0" y="402" font-size="13" fill="#d97706" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">start_task</text><path d="M758 462 L1042 462" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#ad97706)"/><rect x="782.7" y="437" width="235" height="20" rx="6" fill="#f6f9fc"/><text x="900.0" y="452" font-size="13" fill="#d97706" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">robots/commands/tasks/start</text><path d="M1042 512 L458 512" stroke="#5b6b7f" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a5b6b7f)"/><rect x="649.9" y="487" width="200" height="20" rx="6" fill="#f6f9fc"/><text x="750.0" y="502" font-size="13" fill="#5b6b7f" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">cmdStatus=6 · requestId</text><text x="750.0" y="530" font-size="11.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">delivered ≠ finished</text><path d="M458 562 L742 562" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a2563eb)"/><rect x="525.6" y="537" width="149" height="20" rx="6" fill="#f6f9fc"/><text x="600.0" y="552" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">wait_for_command</text><text x="600.0" y="580" font-size="11.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">poll until terminal</text><path d="M442 612 L158 612" stroke="#5b6b7f" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a5b6b7f)"/><rect x="155.8" y="587" width="288" height="20" rx="6" fill="#f6f9fc"/><text x="300.0" y="602" font-size="13" fill="#5b6b7f" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">“Delivered; checking workState next”</text><rect x="438" y="294" width="24" height="86" rx="6" fill="#d97706" opacity=".18"/><text x="600" y="700" font-size="13.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">Reject, or no answer within 120 s → the tool never runs; the model gets an error result saying it was declined.</text><text x="600" y="726" font-size="13.5" fill="#5b6b7f" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">Also gated: remember (writes memory.md) and every other ⚠ tool. SAODI_AUTO_APPROVE=1 turns the gate off.</text></svg>