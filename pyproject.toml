[project]
name = "mcp-gs-robot"
version = "0.4.1"
description = "MCP Server for Gausium Robot OpenAPI - Control and monitor Gausium cleaning robots through AI assistants"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "toy", email = "cfrs2005@gmail.com" }
]
license = { text = "MIT" }
keywords = ["mcp", "gausium", "robot", "openapi", "fastapi", "agent", "saodi", "h5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0,<2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "anthropic>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/cfrs2005/mcp-gs-robot"
Repository = "https://github.com/cfrs2005/mcp-gs-robot"
Issues = "https://github.com/cfrs2005/mcp-gs-robot/issues"

[project.scripts]
mcp-gs-robot = "gs_openapi.main:main"
gs-robot-server = "gs_openapi.server.__main__:main"
saodi = "gs_openapi.agent.cli:main"
# Deprecated alias kept for one release.
pi-agent = "gs_openapi.agent.cli:legacy_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml"
]

[tool.hatch.build.targets.wheel]
packages = ["src/gs_openapi"]

# The gs-robot Skill is the single source of the Saodi agent's Knowledge/Memory;
# ship it inside the package so an installed wheel can load it.
[tool.hatch.build.targets.wheel.force-include]
"skills/gs-robot" = "gs_openapi/_skills/gs-robot"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
